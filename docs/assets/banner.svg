<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">OpenGenieMaster</title>
  <desc id="desc">Open embodied continual harness for persistent multi-robot work</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a78d6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eda100" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#eda100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f7fb"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#5aa7ff"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#5aa7ff" fill-opacity="0.16"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="430" fill="url(#bg)"/>
  <rect width="1200" height="430" fill="url(#dots)"/>
  <circle cx="180" cy="90" r="240" fill="url(#glowBlue)"/>
  <circle cx="1050" cy="360" r="260" fill="url(#glowAmber)"/>

  <!-- EEP loop motif: agent -> harness -> robot -> back, drawn as a rounded circuit -->
  <g stroke="#2a78d6" stroke-width="2.4" fill="none" opacity="0.9">
    <path d="M930 96 L1086 96 L1086 168" stroke="#3987e5"/>
    <path d="M1086 168 L930 168" stroke="#3987e5"/>
  </g>
  <g stroke="#eda100" stroke-width="2.4" fill="none" opacity="0.85">
    <path d="M930 150 L1010 150 L1010 224 L930 224" stroke="#eda100"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#9fc3ef">
    <rect x="1036" y="104" width="88" height="24" rx="12" fill="#0f2438" stroke="#2a78d6" stroke-opacity="0.5"/>
    <text x="1080" y="121" text-anchor="middle" font-size="12.5" fill="#bfe0ff">agent</text>
    <rect x="1036" y="140" width="88" height="24" rx="12" fill="#0f2438" stroke="#2a78d6" stroke-opacity="0.5"/>
    <text x="1080" y="157" text-anchor="middle" font-size="12.5" fill="#bfe0ff">harness</text>
    <rect x="1036" y="176" width="88" height="24" rx="12" fill="#0f2438" stroke="#eda100" stroke-opacity="0.5"/>
    <text x="1080" y="193" text-anchor="middle" font-size="12.5" fill="#ffd27a">robot</text>
  </g>

  <!-- wordmark -->
  <text x="600" y="205" text-anchor="middle" font-size="58" font-weight="800" letter-spacing="-1" fill="url(#wordmark)">Open<tspan fill="#58a6ff">Genie</tspan>Master</text>

  <text x="600" y="252" text-anchor="middle" font-size="21" font-weight="500" fill="#c6d4e6">An open embodied continual harness for persistent multi-robot work</text>
  <text x="600" y="286" text-anchor="middle" font-size="15" fill="#8fa6c4">Independent open-source re-implementation of AgiBot&apos;s GenieMaster — EEP over MCP, task continuity, memory &amp; reflection</text>

  <!-- chips -->
  <g text-anchor="middle" font-size="14.5" font-weight="600">
    <rect x="272" y="318" width="150" height="34" rx="17" fill="#0f2438" stroke="#2a78d6" stroke-opacity="0.55"/>
    <text x="347" y="340" fill="#bfe0ff">EEP · MCP</text>
    <rect x="442" y="318" width="150" height="34" rx="17" fill="#0f2438" stroke="#2a78d6" stroke-opacity="0.55"/>
    <text x="517" y="340" fill="#bfe0ff">Multi-robot</text>
    <rect x="612" y="318" width="190" height="34" rx="17" fill="#0f2438" stroke="#2a78d6" stroke-opacity="0.55"/>
    <text x="707" y="340" fill="#bfe0ff">Task continuity</text>
    <rect x="822" y="318" width="190" height="34" rx="17" fill="#241d0c" stroke="#eda100" stroke-opacity="0.5"/>
    <text x="917" y="340" fill="#ffd27a">Memory &amp; reflection</text>
  </g>

  <!-- footer line -->
  <text x="600" y="392" text-anchor="middle" font-size="12.5" fill="#6e86a3">Python 3.10+ · zero core dependencies · MIT</text>
</svg>
