<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Learning from experience</title>
  <desc id="d">Success rate with and without long-term memory across five reflection rounds; memory keeps SR high even when the no-memory policy degrades.</desc>
  <style>
    :root{
      --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#3f3d3a; --ink3:#898781; --line:#e1e0d9; --mem:#2a78d6; --no:#9b9a95;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8b8a84; --line:#2c2c2a; --mem:#3987e5; --no:#757470;
      }
    }
    .bg{fill:var(--bg)}
    .t1{fill:var(--ink); font-weight:800}
    .t2{fill:var(--ink2)}
    .grid{stroke:var(--line); stroke-width:1}
    .axis{fill:var(--ink3); font-size:12; text-anchor:end}
    .xaxis{fill:var(--ink3); font-size:12.5; text-anchor:middle}
    .memline{stroke:var(--mem); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round}
    .noline{stroke:var(--no); stroke-width:2.5; fill:none; stroke-dasharray:6 5; stroke-linecap:round}
    .valM{fill:var(--mem); font-size:13; font-weight:700; text-anchor:middle}
    .valN{fill:var(--ink3); font-size:12; text-anchor:middle}
    .lgT{fill:var(--ink2); font-size:13}
  </style>

  <rect class="bg" width="1200" height="470"/>
  <text x="110" y="46" class="t1" font-size="24">Learning from experience</text>
  <text x="110" y="72" class="t2" font-size="13.5">office_supply_search · 10 trials per round · long-term memory raises success rate and holds it steady</text>

  <!-- legend -->
  <line x1="700" y1="44" x2="730" y2="44" class="memline" stroke-width="3"/>
  <text x="738" y="49" class="lgT">with memory</text>
  <line x1="870" y1="44" x2="900" y2="44" class="noline"/>
  <text x="908" y="49" class="lgT">no memory</text>

  <!-- y gridlines + labels -->
  <g>
    <line class="grid" x1="110" y1="110" x2="1120" y2="110"/>
    <line class="grid" x1="110" y1="182.5" x2="1120" y2="182.5"/>
    <line class="grid" x1="110" y1="255" x2="1120" y2="255"/>
    <line class="grid" x1="110" y1="327.5" x2="1120" y2="327.5"/>
    <line class="grid" x1="110" y1="400" x2="1120" y2="400"/>
    <text class="axis" x="98" y="114">100</text>
    <text class="axis" x="98" y="187">75</text>
    <text class="axis" x="98" y="259">50</text>
    <text class="axis" x="98" y="332">25</text>
    <text class="axis" x="98" y="404">0</text>
  </g>

  <!-- no-memory line -->
  <polyline class="noline" points="110,226 362.5,313 615,226 867.5,313 1120,255"/>
  <g fill="var(--no)" stroke="var(--bg)" stroke-width="2">
    <circle cx="110" cy="226" r="5"/><circle cx="362.5" cy="313" r="5"/><circle cx="615" cy="226" r="5"/><circle cx="867.5" cy="313" r="5"/><circle cx="1120" cy="255" r="5"/>
  </g>
  <g class="valN">
    <text x="110" y="244">60</text>
    <text x="362.5" y="344">30</text>
    <text x="615" y="244">60</text>
    <text x="867.5" y="344">30</text>
    <text x="1120" y="244">50</text>
  </g>

  <!-- memory line -->
  <polyline class="memline" points="110,226 362.5,226 615,110 867.5,168 1120,139"/>
  <g fill="var(--mem)" stroke="var(--bg)" stroke-width="2">
    <circle cx="110" cy="226" r="5.5"/><circle cx="362.5" cy="226" r="5.5"/><circle cx="615" cy="110" r="5.5"/><circle cx="867.5" cy="168" r="5.5"/><circle cx="1120" cy="139" r="5.5"/>
  </g>
  <g class="valM">
    <text x="110" y="212">60</text>
    <text x="362.5" y="212">60</text>
    <text x="615" y="96">100</text>
    <text x="867.5" y="154">80</text>
    <text x="1120" y="125">90</text>
  </g>

  <!-- x labels -->
  <g class="xaxis">
    <text x="110" y="426">Round 1</text>
    <text x="362.5" y="426">Round 2</text>
    <text x="615" y="426">Round 3</text>
    <text x="867.5" y="426">Round 4</text>
    <text x="1120" y="426">Round 5</text>
  </g>
  <text x="615" y="448" class="t2" font-size="11.5" text-anchor="middle">memory entries: 0 → 3 → 6 → 7 → 7 · reflection runs after each round</text>
</svg>
