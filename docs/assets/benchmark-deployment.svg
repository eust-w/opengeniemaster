<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Persistent multi-robot deployment</title>
  <desc id="d">A 24-hour simulated shift with three robots: 93.85% of orders delivered correctly.</desc>
  <style>
    :root{
      --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#3f3d3a; --ink3:#898781; --line:#e1e0d9; --card:#ffffff; --blue:#2a78d6; --amber:#c98500;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8b8a84; --line:#2c2c2a; --card:#20201f; --blue:#3987e5; --amber:#e0a32b;
      }
    }
    .bg{fill:var(--bg)}
    .t1{fill:var(--ink); font-weight:800}
    .t2{fill:var(--ink2)}
    .tile{fill:var(--card); stroke:var(--line); stroke-width:1.4}
    .num{font-size:38; font-weight:800; text-anchor:middle}
    .lbl{fill:var(--ink); font-size:14; font-weight:600; text-anchor:middle}
    .sub{fill:var(--ink3); font-size:11.5; text-anchor:middle}
  </style>

  <rect class="bg" width="1200" height="330"/>
  <text x="24" y="44" class="t1" font-size="22">Persistent multi-robot deployment</text>
  <text x="24" y="68" class="t2" font-size="13">one simulated 24-hour shift · 3 robots · 1008 executions</text>

  <g>
    <rect class="tile" x="24" y="96" width="180" height="196" rx="14"/>
    <text x="114" y="172" class="num" fill="var(--blue)">93.85%</text>
    <text x="114" y="216" class="lbl">orders correct</text>
    <text x="114" y="240" class="sub">61 / 65 delivered</text>

    <rect class="tile" x="218" y="96" width="180" height="196" rx="14"/>
    <text x="308" y="172" class="num" fill="var(--blue)">24 h</text>
    <text x="308" y="216" class="lbl">simulated shift</text>
    <text x="308" y="240" class="sub">cart-01 · wh-01 · wh-02</text>

    <rect class="tile" x="412" y="96" width="180" height="196" rx="14"/>
    <text x="502" y="172" class="num" fill="var(--blue)">30</text>
    <text x="502" y="216" class="lbl">practice tasks</text>
    <text x="502" y="240" class="sub">self-directed in idle time</text>

    <rect class="tile" x="606" y="96" width="180" height="196" rx="14"/>
    <text x="696" y="172" class="num" fill="var(--blue)">15</text>
    <text x="696" y="216" class="lbl">restock tasks</text>
    <text x="696" y="240" class="sub">13 completed correctly</text>

    <rect class="tile" x="800" y="96" width="180" height="196" rx="14"/>
    <text x="890" y="172" class="num" fill="var(--blue)">3</text>
    <text x="890" y="216" class="lbl">outage recoveries</text>
    <text x="890" y="240" class="sub">interrupted → resumed</text>

    <rect class="tile" x="994" y="96" width="180" height="196" rx="14"/>
    <text x="1084" y="172" class="num" fill="var(--amber)">1</text>
    <text x="1084" y="216" class="lbl">safety violation</text>
    <text x="1084" y="240" class="sub">caught by interlock</text>
  </g>
</svg>
