<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Unseen-product generalization</title>
  <desc id="d">EEP guidance keeps success rate high on novel products, e.g. 16% to 76% at 1000 training SKUs.</desc>
  <style>
    :root{
      --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#3f3d3a; --ink3:#898781; --line:#e1e0d9; --eep:#2a78d6; --txt:#9b9a95;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8b8a84; --line:#2c2c2a; --eep:#3987e5; --txt:#757470;
      }
    }
    .bg{fill:var(--bg)}
    .t1{fill:var(--ink); font-weight:800}
    .t2{fill:var(--ink2)}
    .grid{stroke:var(--line); stroke-width:1}
    .axis{fill:var(--ink3); font-size:12; text-anchor:end}
    .val{font-size:12.5; font-weight:700; text-anchor:middle}
    .gx{fill:var(--ink2); font-size:12.5; font-weight:600; text-anchor:middle}
    .gs{fill:var(--ink3); font-size:11; text-anchor:middle}
    .lgT{fill:var(--ink2); font-size:13}
  </style>

  <rect class="bg" width="1200" height="470"/>
  <text x="110" y="46" class="t1" font-size="24">Unseen-product generalization</text>
  <text x="110" y="72" class="t2" font-size="13.5">25 trials per cell · EEP guidance keeps success rate high even on products the policy never trained on</text>

  <!-- legend -->
  <rect x="760" y="32" width="16" height="16" rx="3" fill="var(--txt)"/>
  <text x="782" y="45" class="lgT">text-only guidance</text>
  <rect x="920" y="32" width="16" height="16" rx="3" fill="var(--eep)"/>
  <text x="942" y="45" class="lgT">EEP-guided</text>

  <g>
    <line class="grid" x1="110" y1="110" x2="1120" y2="110"/>
    <line class="grid" x1="110" y1="177.5" x2="1120" y2="177.5"/>
    <line class="grid" x1="110" y1="245" x2="1120" y2="245"/>
    <line class="grid" x1="110" y1="312.5" x2="1120" y2="312.5"/>
    <line class="grid" x1="110" y1="380" x2="1120" y2="380"/>
    <text class="axis" x="98" y="114">100</text>
    <text class="axis" x="98" y="181.5">75</text>
    <text class="axis" x="98" y="249">50</text>
    <text class="axis" x="98" y="316.5">25</text>
    <text class="axis" x="98" y="384">0</text>
  </g>

  <!-- bars (y = 380 - v*2.7), bar w=54 -->
  <g>
    <!-- 10 seen -->
    <rect x="134.2" y="261.2" width="54" height="118.8" rx="4" fill="var(--txt)"/>
    <rect x="200.2" y="164" width="54" height="216" rx="4" fill="var(--eep)"/>
    <!-- 10 novel -->
    <rect x="302.5" y="358.4" width="54" height="21.6" rx="4" fill="var(--txt)"/>
    <rect x="368.5" y="315.2" width="54" height="64.8" rx="4" fill="var(--eep)"/>
    <!-- 30 seen -->
    <rect x="470.8" y="261.2" width="54" height="118.8" rx="4" fill="var(--txt)"/>
    <rect x="536.8" y="164" width="54" height="216" rx="4" fill="var(--eep)"/>
    <!-- 30 novel -->
    <rect x="639.2" y="358.4" width="54" height="21.6" rx="4" fill="var(--txt)"/>
    <rect x="705.2" y="293.6" width="54" height="86.4" rx="4" fill="var(--eep)"/>
    <!-- 1000 seen -->
    <rect x="807.5" y="261.2" width="54" height="118.8" rx="4" fill="var(--txt)"/>
    <rect x="873.5" y="164" width="54" height="216" rx="4" fill="var(--eep)"/>
    <!-- 1000 novel -->
    <rect x="975.8" y="336.8" width="54" height="43.2" rx="4" fill="var(--txt)"/>
    <rect x="1041.8" y="174.8" width="54" height="205.2" rx="4" fill="var(--eep)"/>
  </g>

  <g class="val">
    <text x="161.2" y="253" fill="var(--ink2)">44</text>
    <text x="227.2" y="156" fill="var(--eep)">80</text>
    <text x="329.5" y="350" fill="var(--ink3)">8</text>
    <text x="395.5" y="307" fill="var(--eep)">24</text>
    <text x="497.8" y="253" fill="var(--ink2)">44</text>
    <text x="563.8" y="156" fill="var(--eep)">80</text>
    <text x="666.2" y="350" fill="var(--ink3)">8</text>
    <text x="732.2" y="285" fill="var(--eep)">32</text>
    <text x="834.5" y="253" fill="var(--ink2)">44</text>
    <text x="900.5" y="156" fill="var(--eep)">80</text>
    <text x="1002.8" y="328" fill="var(--ink3)">16</text>
    <text x="1068.8" y="166" fill="var(--eep)">76</text>
  </g>

  <g>
    <text x="194.2" y="404" class="gx">10</text><text x="194.2" y="420" class="gs">seen</text>
    <text x="362.5" y="404" class="gx">10</text><text x="362.5" y="420" class="gs">novel</text>
    <text x="530.8" y="404" class="gx">30</text><text x="530.8" y="420" class="gs">seen</text>
    <text x="699.2" y="404" class="gx">30</text><text x="699.2" y="420" class="gs">novel</text>
    <text x="867.5" y="404" class="gx">1000</text><text x="867.5" y="420" class="gs">seen</text>
    <text x="1035.8" y="404" class="gx">1000</text><text x="1035.8" y="420" class="gs">novel</text>
  </g>
  <text x="615" y="448" class="t2" font-size="11.5" text-anchor="middle">training SKUs · split</text>
</svg>
